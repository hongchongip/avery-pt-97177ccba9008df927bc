<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Avery，一定得！｜普通話閃卡測驗版</title>
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://hongchongip.github.io/avery-pt-97177ccba9008df927bc/quiz.html" />
  <meta property="og:title" content="Avery，一定得！｜普通話閃卡測驗版" />
  <meta property="og:description" content="隨機 20 個普通話重點詞語，每張卡揀 ✓（啱）或 ✕（唔啱），做完自動出結果總覽。" />
  <meta property="og:image" content="https://hongchongip.github.io/avery-pt-97177ccba9008df927bc/og-cover-avery.jpg?v=2" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Avery，一定得！｜普通話閃卡測驗版" />
  <meta name="twitter:description" content="隨機 20 個普通話重點詞語，每張卡揀 ✓（啱）或 ✕（唔啱），做完自動出結果總覽。" />
  <meta name="twitter:image" content="https://hongchongip.github.io/avery-pt-97177ccba9008df927bc/og-cover-avery.jpg?v=2" />
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --ink: #1b1d21;
      --muted: #6c727f;
      --border: #e6e3dc;
      --accent: #3d637d;
      --accent-soft: #eef3f7;
      --ok: #1e7e4d;
      --ok-bg: #eaf7f0;
      --ok-border: #bfe6cf;
      --bad: #c93b3b;
      --bad-bg: #fdf0f0;
      --bad-border: #f3c4c4;
      --shadow: 0 12px 32px rgba(27, 29, 33, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      max-width: 480px;
      margin: 0 auto;
    }

    .wrap.results-mode {
      justify-content: flex-start;
    }

    .hidden {
      display: none !important;
    }

    header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      color: var(--muted);
      padding: 4px 2px;
      gap: 10px;
    }

    .title {
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.02em;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-variant-numeric: tabular-nums;
    }

    .tally {
      font-size: 13px;
      font-weight: 600;
    }

    .tally .ok { color: var(--ok); }
    .tally .bad { color: var(--bad); }

    .speed-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .speed-btn {
      appearance: none;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      padding: 11px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      font-family: inherit;
    }

    .speed-btn:active {
      transform: scale(0.98);
    }

    .speed-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .card {
      width: 100%;
      flex: 1;
      max-height: 410px;
      min-height: 290px;
      margin: 14px 0 16px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      position: relative;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .card:active {
      transform: scale(0.985);
    }

    .card.heard {
      border-color: var(--accent);
      background: #fcfdfe;
    }

    .lesson-tag {
      position: absolute;
      top: 20px;
      left: 22px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 5px 12px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }

    .state-dot {
      position: absolute;
      top: 22px;
      right: 22px;
      font-size: 13px;
      color: var(--muted);
    }

    .word {
      font-size: clamp(64px, 19vw, 96px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: 0.08em;
      text-align: center;
      color: var(--ink);
      margin: 0;
      padding-left: 0.08em;
    }

    .pinyin {
      margin-top: 22px;
      font-size: clamp(24px, 6.5vw, 34px);
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.06em;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif;
    }

    .hint {
      position: absolute;
      bottom: 22px;
      left: 20px;
      right: 20px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    .card.heard .hint {
      color: var(--accent);
      font-weight: 500;
    }

    .judge-controls {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .judge-btn {
      appearance: none;
      border: 2px solid transparent;
      font-size: 20px;
      font-weight: 700;
      padding: 16px 14px;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease, filter 0.15s ease;
      font-family: inherit;
    }

    .judge-btn:active {
      transform: scale(0.97);
    }

    .judge-btn.btn-wrong {
      background: var(--bad-bg);
      color: var(--bad);
      border-color: var(--bad-border);
    }

    .judge-btn.btn-right {
      background: var(--ok-bg);
      color: var(--ok);
      border-color: var(--ok-border);
    }

    .sub-controls {
      width: 100%;
      margin-top: 10px;
      display: flex;
      justify-content: center;
    }

    .replay-btn {
      appearance: none;
      width: 100%;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      padding: 11px 16px;
      border-radius: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .replay-btn:active {
      transform: scale(0.985);
      background: var(--accent-soft);
    }

    .notice {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      min-height: 16px;
    }

    /* Results view */
    .results-view {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }

    .summary-card {
      width: 100%;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 20px 18px;
      text-align: center;
    }

    .summary-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 8px;
    }

    .summary-score {
      font-size: 40px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1.1;
      margin: 4px 0 12px;
      font-variant-numeric: tabular-nums;
    }

    .summary-pills {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      font-size: 14px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
    }

    .pill.ok {
      background: var(--ok-bg);
      color: var(--ok);
      border: 1px solid var(--ok-border);
    }

    .pill.bad {
      background: var(--bad-bg);
      color: var(--bad);
      border: 1px solid var(--bad-border);
    }

    .results-hint {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin: -4px 0 0;
    }

    .results-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-row {
      width: 100%;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .result-row:active {
      transform: scale(0.99);
    }

    .result-row.is-right {
      border-left: 5px solid var(--ok);
    }

    .result-row.is-wrong {
      border-left: 5px solid var(--bad);
      background: #fffafa;
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .row-num {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      width: 22px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .row-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .row-word-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .row-word {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
    }

    .row-pinyin {
      font-size: 14px;
      font-weight: 500;
      color: var(--accent);
    }

    .row-lesson {
      font-size: 12px;
      color: var(--muted);
    }

    .row-badge {
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .row-badge.ok {
      background: var(--ok-bg);
      color: var(--ok);
      border: 1px solid var(--ok-border);
    }

    .row-badge.bad {
      background: var(--bad-bg);
      color: var(--bad);
      border: 1px solid var(--bad-border);
    }

    .results-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
      padding-bottom: 12px;
    }

    .action-btn {
      appearance: none;
      width: 100%;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
      padding: 15px 16px;
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .action-btn:active {
      transform: scale(0.985);
    }

    .action-btn.primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .action-btn.retry-wrong {
      background: var(--bad-bg);
      color: var(--bad);
      border-color: var(--bad-border);
    }
  </style>
</head>
<body>
  <main id="wrap" class="wrap">
    <header>
      <span class="title">普通話閃卡測驗</span>
      <div class="progress-meta">
        <span id="tally" class="tally"><span class="ok">✓ 0</span> · <span class="bad">✕ 0</span></span>
        <span id="counter">1 / 20</span>
      </div>
    </header>

    <!-- Quiz View -->
    <div id="quizView" style="width:100%; flex:1; display:flex; flex-direction:column; justify-content:space-between;">
      <div class="speed-row" role="group" aria-label="發音速度">
        <button id="speedNormalBtn" class="speed-btn active" type="button" aria-pressed="true">正常速</button>
        <button id="speedSlowBtn" class="speed-btn" type="button" aria-pressed="false">慢速</button>
      </div>

      <section id="card" class="card" role="button" tabindex="0" aria-label="點擊聽普通話發音">
        <span id="lesson" class="lesson-tag">第一課</span>
        <span id="status" class="state-dot">點一下發音</span>
        <h1 id="word" class="word">六歲</h1>
        <div id="pinyin" class="pinyin">liù suì</div>
        <div id="hint" class="hint">點一下聽普通話發音・下方揀 ✓ 或 ✕</div>
      </section>

      <div>
        <div class="judge-controls">
          <button id="wrongBtn" class="judge-btn btn-wrong" type="button" aria-label="答錯">✕ 唔啱</button>
          <button id="rightBtn" class="judge-btn btn-right" type="button" aria-label="答啱">✓ 啱</button>
        </div>

        <div class="sub-controls">
          <button id="replayBtn" class="replay-btn" type="button">🔊 再聽一次</button>
        </div>

        <div id="notice" class="notice"></div>
      </div>
    </div>

    <!-- Results View -->
    <section id="resultsView" class="results-view hidden" aria-label="測驗結果">
      <div class="summary-card">
        <h2 id="summaryTitle" class="summary-title">今輪完成！Avery，一定得！</h2>
        <div id="summaryScore" class="summary-score">0 / 20</div>
        <div class="summary-pills">
          <span id="summaryRightPill" class="pill ok">✓ 啱 0 個</span>
          <span id="summaryWrongPill" class="pill bad">✕ 唔啱 0 個</span>
        </div>
      </div>

      <p class="results-hint">點任何一個詞語可以即刻重聽普通話發音</p>

      <div id="resultsList" class="results-list"></div>

      <div class="results-actions">
        <button id="retryWrongBtn" class="action-btn retry-wrong hidden" type="button">只重測答錯嘅詞</button>
        <button id="restartAllBtn" class="action-btn primary" type="button">再測一次（全部 20 個）</button>
      </div>
    </section>
  </main>

  <script>
    const WORDS = [
      { lesson: "第一課", text: "六歲", speak: "六岁", pinyin: "liù suì" },
      { lesson: "第一課", text: "請問", speak: "请问", pinyin: "qǐng wèn" },
      { lesson: "第一課", text: "甚麼", speak: "什么", pinyin: "shén me" },
      { lesson: "第一課", text: "名字", speak: "名字", pinyin: "míng zi" },
      { lesson: "第一課", text: "一年級", speak: "一年级", pinyin: "yī nián jí" },
      { lesson: "第二課", text: "爸爸", speak: "爸爸", pinyin: "bà ba" },
      { lesson: "第二課", text: "媽媽", speak: "妈妈", pinyin: "mā ma" },
      { lesson: "第二課", text: "姐姐", speak: "姐姐", pinyin: "jiě jie" },
      { lesson: "第二課", text: "弟弟", speak: "弟弟", pinyin: "dì di" },
      { lesson: "第二課", text: "六口人", speak: "六口人", pinyin: "liù kǒu rén" },
      { lesson: "第三課", text: "最愛", speak: "最爱", pinyin: "zuì ài" },
      { lesson: "第三課", text: "好吃", speak: "好吃", pinyin: "hǎo chī" },
      { lesson: "第三課", text: "咱們", speak: "咱们", pinyin: "zán men" },
      { lesson: "第三課", text: "健康", speak: "健康", pinyin: "jiàn kāng" },
      { lesson: "第三課", text: "小賣部", speak: "小卖部", pinyin: "xiǎo mài bù" },
      { lesson: "第四課", text: "哪裏", speak: "哪里", pinyin: "nǎ li" },
      { lesson: "第四課", text: "音樂室", speak: "音乐室", pinyin: "yīn yuè shì" },
      { lesson: "第四課", text: "旁邊", speak: "旁边", pinyin: "páng biān" },
      { lesson: "第四課", text: "樓梯口", speak: "楼梯口", pinyin: "lóu tī kǒu" },
      { lesson: "第四課", text: "廣播室", speak: "广播室", pinyin: "guǎng bō shì" }
    ];

    const wrapEl = document.getElementById("wrap");
    const quizViewEl = document.getElementById("quizView");
    const resultsViewEl = document.getElementById("resultsView");
    const cardEl = document.getElementById("card");
    const lessonEl = document.getElementById("lesson");
    const statusEl = document.getElementById("status");
    const wordEl = document.getElementById("word");
    const pinyinEl = document.getElementById("pinyin");
    const hintEl = document.getElementById("hint");
    const counterEl = document.getElementById("counter");
    const tallyEl = document.getElementById("tally");
    const noticeEl = document.getElementById("notice");
    const replayBtn = document.getElementById("replayBtn");
    const rightBtn = document.getElementById("rightBtn");
    const wrongBtn = document.getElementById("wrongBtn");
    const speedNormalBtn = document.getElementById("speedNormalBtn");
    const speedSlowBtn = document.getElementById("speedSlowBtn");
    const summaryTitleEl = document.getElementById("summaryTitle");
    const summaryScoreEl = document.getElementById("summaryScore");
    const summaryRightPillEl = document.getElementById("summaryRightPill");
    const summaryWrongPillEl = document.getElementById("summaryWrongPill");
    const resultsListEl = document.getElementById("resultsList");
    const retryWrongBtn = document.getElementById("retryWrongBtn");
    const restartAllBtn = document.getElementById("restartAllBtn");

    let deck = [];
    let currentIndex = 0;
    let results = [];
    let cachedVoice = null;
    let speechRate = 1.0;

    function setSpeed(mode) {
      speechRate = mode === "slow" ? 0.55 : 1.0;
      const isSlow = mode === "slow";
      speedNormalBtn.classList.toggle("active", !isSlow);
      speedNormalBtn.setAttribute("aria-pressed", String(!isSlow));
      speedSlowBtn.classList.toggle("active", isSlow);
      speedSlowBtn.setAttribute("aria-pressed", String(isSlow));
    }

    function pickZhCnVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return null;
      const exact = voices.find(v => /^zh[-_]CN$/i.test(v.lang));
      if (exact) return exact;
      const mandarin = voices.find(v => /^zh/i.test(v.lang) && !/HK|yue/i.test(v.lang));
      return mandarin || voices.find(v => /^zh/i.test(v.lang)) || null;
    }

    if ("speechSynthesis" in window) {
      cachedVoice = pickZhCnVoice();
      window.speechSynthesis.onvoiceschanged = () => {
        cachedVoice = pickZhCnVoice();
      };
    }

    function shuffle(items) {
      const copy = items.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function updateHeader() {
      const rightCount = results.filter(r => r.correct).length;
      const wrongCount = results.length - rightCount;
      tallyEl.innerHTML = `<span class="ok">✓ ${rightCount}</span> · <span class="bad">✕ ${wrongCount}</span>`;
      const shownIndex = Math.min(currentIndex + 1, deck.length);
      counterEl.textContent = `${shownIndex} / ${deck.length}`;
    }

    function speakText(speakStr, onStartUi) {
      if (!("speechSynthesis" in window)) {
        noticeEl.textContent = "此瀏覽器未支援語音朗讀，請用 Safari 或 Chrome 開啟。";
        return;
      }
      noticeEl.textContent = "";
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(speakStr);
      utter.lang = "zh-CN";
      utter.rate = speechRate;
      utter.pitch = 1.0;
      const voice = cachedVoice || pickZhCnVoice();
      if (voice) utter.voice = voice;

      if (onStartUi) {
        onStartUi(utter);
      }
      window.speechSynthesis.speak(utter);
    }

    function speakCurrent() {
      const item = deck[currentIndex];
      if (!item) return;
      speakText(item.speak, (utter) => {
        cardEl.classList.add("heard");
        statusEl.textContent = "🔊 播放中";
        hintEl.textContent = "聽完揀下方 ✓（啱）或 ✕（唔啱）";
        utter.onend = () => {
          statusEl.textContent = "已播放";
        };
        utter.onerror = () => {
          statusEl.textContent = "點一下再播";
        };
      });
    }

    function renderCard() {
      const item = deck[currentIndex];
      if (!item) return;
      lessonEl.textContent = item.lesson;
      wordEl.textContent = item.text;
      pinyinEl.textContent = item.pinyin;
      statusEl.textContent = "點一下發音";
      hintEl.textContent = "點一下聽普通話發音・下方揀 ✓ 或 ✕";
      cardEl.classList.remove("heard");
      updateHeader();
    }

    function showResults() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      quizViewEl.classList.add("hidden");
      resultsViewEl.classList.remove("hidden");
      wrapEl.classList.add("results-mode");
      counterEl.textContent = `完成 ${deck.length} / ${deck.length}`;

      const rightCount = results.filter(r => r.correct).length;
      const wrongItems = results.filter(r => !r.correct);
      const wrongCount = wrongItems.length;

      summaryTitleEl.textContent = wrongCount === 0
        ? "全部答啱！Avery 好叻！"
        : "今輪完成！Avery，一定得！";
      summaryScoreEl.textContent = `${rightCount} / ${results.length}`;
      summaryRightPillEl.textContent = `✓ 啱 ${rightCount} 個`;
      summaryWrongPillEl.textContent = `✕ 唔啱 ${wrongCount} 個`;

      resultsListEl.innerHTML = "";
      results.forEach((entry, idx) => {
        const row = document.createElement("div");
        row.className = `result-row ${entry.correct ? "is-right" : "is-wrong"}`;
        row.setAttribute("role", "button");
        row.setAttribute("tabindex", "0");
        row.setAttribute("aria-label", `${entry.item.text}，${entry.correct ? "答啱" : "答錯"}，點擊聽發音`);

        row.innerHTML = `
          <div class="row-left">
            <span class="row-num">${idx + 1}</span>
            <div class="row-text">
              <div class="row-word-line">
                <span class="row-word">${entry.item.text}</span>
                <span class="row-pinyin">${entry.item.pinyin}</span>
              </div>
              <span class="row-lesson">${entry.item.lesson}</span>
            </div>
          </div>
          <span class="row-badge ${entry.correct ? "ok" : "bad"}">${entry.correct ? "✓ 啱" : "✕ 唔啱"}</span>
        `;

        const playRow = () => speakText(entry.item.speak);
        row.addEventListener("click", playRow);
        row.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            playRow();
          }
        });
        resultsListEl.appendChild(row);
      });

      if (wrongCount > 0) {
        retryWrongBtn.classList.remove("hidden");
        retryWrongBtn.textContent = `只重測答錯嘅詞（${wrongCount} 個）`;
      } else {
        retryWrongBtn.classList.add("hidden");
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function recordAnswer(isCorrect) {
      const item = deck[currentIndex];
      if (!item) return;
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      results.push({ item, correct: isCorrect });
      currentIndex += 1;
      updateHeader();

      if (currentIndex >= deck.length) {
        showResults();
      } else {
        renderCard();
      }
    }

    function startRound(sourceWords) {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      deck = shuffle(sourceWords);
      currentIndex = 0;
      results = [];
      resultsViewEl.classList.add("hidden");
      quizViewEl.classList.remove("hidden");
      wrapEl.classList.remove("results-mode");
      renderCard();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    speedNormalBtn.addEventListener("click", () => setSpeed("normal"));
    speedSlowBtn.addEventListener("click", () => setSpeed("slow"));

    cardEl.addEventListener("click", () => speakCurrent());
    cardEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        speakCurrent();
      }
    });

    replayBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      speakCurrent();
    });

    rightBtn.addEventListener("click", () => recordAnswer(true));
    wrongBtn.addEventListener("click", () => recordAnswer(false));

    restartAllBtn.addEventListener("click", () => startRound(WORDS));
    retryWrongBtn.addEventListener("click", () => {
      const wrongWords = results.filter(r => !r.correct).map(r => r.item);
      if (wrongWords.length > 0) {
        startRound(wrongWords);
      }
    });

    startRound(WORDS);
  </script>
</body>
</html>
