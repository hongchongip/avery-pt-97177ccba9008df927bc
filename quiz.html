<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Avery，一定得！｜普通話閃卡測驗版</title>
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://hongchongip.github.io/avery-pt-97177ccba9008df927bc/quiz.html" />
  <meta property="og:title" content="Avery，一定得！｜普通話閃卡測驗版" />
  <meta property="og:description" content="隨機 20 個普通話重點詞語，每張卡揀 ✓（啱）或 ✕（唔啱），做完自動出結果總覽。" />
  <meta property="og:image" content="https://hongchongip.github.io/avery-pt-97177ccba9008df927bc/og-cover-avery.jpg?v=3" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Avery，一定得！｜普通話閃卡測驗版" />
  <meta name="twitter:description" content="隨機 20 個普通話重點詞語，每張卡揀 ✓（啱）或 ✕（唔啱），做完自動出結果總覽。" />
  <meta name="twitter:image" content="https://hongchongip.github.io/avery-pt-97177ccba9008df927bc/og-cover-avery.jpg?v=3" />
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --ink: #1b1d21;
      --muted: #6c727f;
      --border: #e6e3dc;
      --accent: #3d637d;
      --accent-soft: #eef3f7;
      --ok: #1e7e4d;
      --ok-bg: #eaf7f0;
      --ok-border: #bfe6cf;
      --bad: #c93b3b;
      --bad-bg: #fdf0f0;
      --bad-border: #f3c4c4;
      --shadow: 0 12px 32px rgba(27, 29, 33, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    html.results-page,
    html.results-page body {
      background: #fde8ef;
    }

    .wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      max-width: 480px;
      margin: 0 auto;
    }

    .wrap.results-mode {
      justify-content: flex-start;
    }

    .hidden {
      display: none !important;
    }

    header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      color: var(--muted);
      padding: 4px 2px;
      gap: 10px;
    }

    .title {
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.02em;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-variant-numeric: tabular-nums;
    }

    .tally {
      font-size: 13px;
      font-weight: 600;
    }

    .tally .ok { color: var(--ok); }
    .tally .bad { color: var(--bad); }

    .speed-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .speed-btn {
      appearance: none;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      padding: 11px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      font-family: inherit;
    }

    .speed-btn:active {
      transform: scale(0.98);
    }

    .speed-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .card {
      width: 100%;
      flex: 1;
      max-height: 410px;
      min-height: 290px;
      margin: 14px 0 16px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      position: relative;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .card:active {
      transform: scale(0.985);
    }

    .card.heard {
      border-color: var(--accent);
      background: #fcfdfe;
    }

    .lesson-tag {
      position: absolute;
      top: 20px;
      left: 22px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 5px 12px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }

    .state-dot {
      position: absolute;
      top: 22px;
      right: 22px;
      font-size: 13px;
      color: var(--muted);
    }

    .word {
      font-size: clamp(64px, 19vw, 96px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: 0.08em;
      text-align: center;
      color: var(--ink);
      margin: 0;
      padding-left: 0.08em;
    }

    .pinyin {
      margin-top: 22px;
      font-size: clamp(24px, 6.5vw, 34px);
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.06em;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif;
    }

    .hint {
      position: absolute;
      bottom: 22px;
      left: 20px;
      right: 20px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    .card.heard .hint {
      color: var(--accent);
      font-weight: 500;
    }

    .judge-controls {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .judge-btn {
      appearance: none;
      border: 2px solid transparent;
      font-size: 20px;
      font-weight: 700;
      padding: 16px 14px;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease, filter 0.15s ease;
      font-family: inherit;
    }

    .judge-btn:active {
      transform: scale(0.97);
    }

    .judge-btn.btn-wrong {
      background: var(--bad-bg);
      color: var(--bad);
      border-color: var(--bad-border);
    }

    .judge-btn.btn-right {
      background: var(--ok-bg);
      color: var(--ok);
      border-color: var(--ok-border);
    }

    .sub-controls {
      width: 100%;
      margin-top: 10px;
      display: flex;
      justify-content: center;
    }

    .replay-btn {
      appearance: none;
      width: 100%;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      padding: 11px 16px;
      border-radius: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .replay-btn:active {
      transform: scale(0.985);
      background: var(--accent-soft);
    }

    .notice {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      min-height: 16px;
    }

    /* Results view */
    .results-view {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }

    .score-poster {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 28px;
      overflow: hidden;
      background: #f7c3d2;
      isolation: isolate;
      box-shadow:
        0 16px 40px rgba(139, 26, 74, 0.18),
        0 0 0 3px #f6d27a,
        0 0 0 8px #fff8ee,
        0 0 0 10px rgba(232, 176, 90, 0.55);
    }

    .poster-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center right;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .poster-frame {
      position: absolute;
      inset: 10px;
      border: 1.5px solid rgba(255, 248, 238, 0.8);
      border-radius: 20px;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(232, 176, 90, 0.22);
      z-index: 1;
    }

    .poster-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      padding: 18px 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .poster-badge {
      align-self: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #8b1a4a;
      background: rgba(255, 255, 255, 0.86);
      border: 1.5px solid rgba(246, 210, 122, 0.95);
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(139, 26, 74, 0.08);
    }

    .speech-bubble {
      margin-top: 14px;
      max-width: min(78%, 280px);
      background: #fff;
      color: #8b1a4a;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.35;
      padding: 12px 16px;
      border-radius: 20px 20px 20px 8px;
      border: 2px solid #f3c1d0;
      box-shadow: 0 8px 20px rgba(139, 26, 74, 0.12);
      position: relative;
    }

    .speech-bubble::after {
      content: "";
      position: absolute;
      right: -7px;
      bottom: 16px;
      width: 14px;
      height: 14px;
      background: #fff;
      border-right: 2px solid #f3c1d0;
      border-bottom: 2px solid #f3c1d0;
      transform: rotate(-45deg);
      border-radius: 0 0 3px 0;
    }

    .score-block {
      margin-top: 8px;
      padding-left: 2px;
    }

    .score-kicker {
      font-size: clamp(22px, 6.2vw, 28px);
      font-weight: 800;
      color: #6b1540;
      letter-spacing: 0.01em;
      text-shadow: 0 1px 0 #fff, 0 0 16px rgba(255, 255, 255, 0.95);
      line-height: 1.2;
    }

    .score-hero {
      display: flex;
      align-items: baseline;
      gap: 0.12em;
      margin-top: 2px;
      width: max-content;
      max-width: 100%;
      flex-wrap: nowrap;
    }

    .score-value {
      font-size: clamp(96px, 32vw, 132px);
      font-weight: 900;
      line-height: 0.86;
      color: #8b1a4a;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.06em;
      text-shadow:
        0 2px 0 #fff,
        0 0 2px #fff,
        0 0 18px rgba(255, 255, 255, 1),
        0 10px 24px rgba(139, 26, 74, 0.18);
    }

    .score-value.is-triple {
      font-size: clamp(80px, 26vw, 112px);
    }

    .score-denom {
      font-size: clamp(26px, 7.2vw, 36px);
      font-weight: 800;
      color: #8b1a4a;
      text-shadow: 0 1px 0 #fff, 0 0 12px rgba(255, 255, 255, 0.95);
      white-space: nowrap;
      line-height: 1;
    }

    @keyframes scorePop {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .score-hero.pop {
      animation: scorePop 0.45s ease-out both;
    }

    .rumi-voice-btn {
      appearance: none;
      margin-top: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.9);
      color: #8b1a4a;
      font-size: 15px;
      font-weight: 800;
      padding: 11px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 8px 20px rgba(139, 26, 74, 0.16);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.12s ease, background-color 0.15s ease, color 0.15s ease;
    }

    .rumi-voice-btn:active {
      transform: scale(0.98);
    }

    .rumi-voice-btn.is-speaking {
      background: #8b1a4a;
      color: #ffffff;
      border-color: #8b1a4a;
    }

    .summary-pills {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      font-size: 14px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
    }

    .pill.ok {
      background: var(--ok-bg);
      color: var(--ok);
      border: 1px solid var(--ok-border);
    }

    .pill.bad {
      background: var(--bad-bg);
      color: var(--bad);
      border: 1px solid var(--bad-border);
    }

    .results-hint {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin: -4px 0 0;
    }

    .results-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-row {
      width: 100%;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .result-row:active {
      transform: scale(0.99);
    }

    .result-row.is-right {
      border-left: 5px solid var(--ok);
    }

    .result-row.is-wrong {
      border-left: 5px solid var(--bad);
      background: #fffafa;
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .row-num {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      width: 22px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .row-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .row-word-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .row-word {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
    }

    .row-pinyin {
      font-size: 14px;
      font-weight: 500;
      color: var(--accent);
    }

    .row-lesson {
      font-size: 12px;
      color: var(--muted);
    }

    .row-badge {
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .row-badge.ok {
      background: var(--ok-bg);
      color: var(--ok);
      border: 1px solid var(--ok-border);
    }

    .row-badge.bad {
      background: var(--bad-bg);
      color: var(--bad);
      border: 1px solid var(--bad-border);
    }

    .results-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
      padding-bottom: 12px;
    }

    .action-btn {
      appearance: none;
      width: 100%;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
      padding: 15px 16px;
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .action-btn:active {
      transform: scale(0.985);
    }

    .action-btn.primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .action-btn.retry-wrong {
      background: var(--bad-bg);
      color: var(--bad);
      border-color: var(--bad-border);
    }
  </style>
</head>
<body>
  <main id="wrap" class="wrap">
    <header>
      <span class="title">普通話閃卡測驗</span>
      <div class="progress-meta">
        <span id="tally" class="tally"><span class="ok">✓ 0</span> · <span class="bad">✕ 0</span></span>
        <span id="counter">1 / 20</span>
      </div>
    </header>

    <!-- Quiz View -->
    <div id="quizView" style="width:100%; flex:1; display:flex; flex-direction:column; justify-content:space-between;">
      <div class="speed-row" role="group" aria-label="發音速度">
        <button id="speedNormalBtn" class="speed-btn active" type="button" aria-pressed="true">正常速</button>
        <button id="speedSlowBtn" class="speed-btn" type="button" aria-pressed="false">慢速</button>
      </div>

      <section id="card" class="card" role="button" tabindex="0" aria-label="點擊聽普通話發音">
        <span id="lesson" class="lesson-tag">第一課</span>
        <span id="status" class="state-dot">點一下發音</span>
        <h1 id="word" class="word">六歲</h1>
        <div id="pinyin" class="pinyin">liù suì</div>
        <div id="hint" class="hint">點一下聽普通話發音・下方揀 ✓ 或 ✕</div>
      </section>

      <div>
        <div class="judge-controls">
          <button id="wrongBtn" class="judge-btn btn-wrong" type="button" aria-label="答錯">✕ 唔啱</button>
          <button id="rightBtn" class="judge-btn btn-right" type="button" aria-label="答啱">✓ 啱</button>
        </div>

        <div class="sub-controls">
          <button id="replayBtn" class="replay-btn" type="button">🔊 再聽一次</button>
        </div>

        <div id="notice" class="notice"></div>
      </div>
    </div>

    <!-- Results View -->

      speedSlowBtn.setAttribute("aria-pressed", String(isSlow));
    }

    function pickZhCnVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return null;
      const exact = voices.find(v => /^zh[-_]CN$/i.test(v.lang));
      if (exact) return exact;
      const mandarin = voices.find(v => /^zh/i.test(v.lang) && !/HK|yue/i.test(v.lang));
      return mandarin || voices.find(v => /^zh/i.test(v.lang)) || null;
    }

    function pickCheerVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return null;
      const cantonese = voices.find(v => /yue/i.test(v.lang) || /yue/i.test(v.name))
        || voices.find(v => /zh[-_]HK/i.test(v.lang) || /hong kong/i.test(v.name));
      if (cantonese) return cantonese;
      return pickZhCnVoice();
    }

    function refreshVoices() {
      cachedVoice = pickZhCnVoice();
      cachedCheerVoice = pickCheerVoice();
    }

    if ("speechSynthesis" in window) {
      refreshVoices();
      window.speechSynthesis.onvoiceschanged = refreshVoices;
    }

    function rumiLines(score) {
      if (score >= 90) {
        return {
          tier: 3,
          bubble: "嘩！你真係好叻呀，Avery！",
          speak: "嘩！你真係好叻呀，Avery！",
          speakMandarin: "哇！你真的很棒呀，Avery！",
          pitch: 1.32,
          rate: 1.08
        };
      }
      if (score >= 50) {
        return {
          tier: 2,
          bubble: "Avery，你已經做得好好，你下次可以再好啲㗎！",
          speak: "Avery！你已經做得好好，你下次可以再好啲㗎！",
          speakMandarin: "Avery！你已经做得很好了，你下次可以更好的！",
          pitch: 1.24,
          rate: 1.04
        };
      }
      return {
        tier: 1,
        bubble: "Avery，下次再加油，你一定得的！",
        speak: "Avery！下次再加油，你一定得的！",
        speakMandarin: "Avery！下次再加油，你一定可以的！",
        pitch: 1.20,
        rate: 1.02
      };
    }

    function setRumiSpeaking(isSpeaking) {
      rumiVoiceBtn.classList.toggle("is-speaking", isSpeaking);
      const label = rumiVoiceBtn.querySelector(".voice-label");
      if (label) label.textContent = isSpeaking ? "Rumi 恭賀緊…" : "聽 Rumi 恭賀";
    }

    function speakRumiCheer(cheer) {
      if (!cheer) return;
      if (!("speechSynthesis" in window)) {
        setRumiSpeaking(false);
        return;
      }
      window.speechSynthesis.cancel();
      const voice = cachedCheerVoice || pickCheerVoice();
      const hasCantonese = !voice || /HK|yue|hong kong/i.test(`${voice.lang} ${voice.name}`);
      const utter = new SpeechSynthesisUtterance(hasCantonese ? cheer.speak : cheer.speakMandarin);
      if (voice) {
        utter.voice = voice;
        utter.lang = voice.lang || "zh-HK";
      } else {
        utter.lang = "zh-HK";
      }
      utter.rate = cheer.rate || 1.05;
      utter.pitch = cheer.pitch || 1.25;
      setRumiSpeaking(true);
      utter.onend = () => setRumiSpeaking(false);
      utter.onerror = () => setRumiSpeaking(false);
      window.speechSynthesis.speak(utter);
    }

    function shuffle(items) {
      const copy = items.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function updateHeader() {
      const rightCount = results.filter(r => r.correct).length;
      const wrongCount = results.length - rightCount;
      tallyEl.innerHTML = `<span class="ok">✓ ${rightCount}</span> · <span class="bad">✕ ${wrongCount}</span>`;
      const shownIndex = Math.min(currentIndex + 1, deck.length);
      counterEl.textContent = `${shownIndex} / ${deck.length}`;
    }

    function speakText(speakStr, onStartUi) {
      if (!("speechSynthesis" in window)) {
        noticeEl.textContent = "此瀏覽器未支援語音朗讀，請用 Safari 或 Chrome 開啟。";
        return;
      }
      noticeEl.textContent = "";
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(speakStr);
      utter.lang = "zh-CN";
      utter.rate = speechRate;
      utter.pitch = 1.0;
      const voice = cachedVoice || pickZhCnVoice();
      if (voice) utter.voice = voice;

      if (onStartUi) {
        onStartUi(utter);
      }
      window.speechSynthesis.speak(utter);
    }

    function speakCurrent() {
      const item = deck[currentIndex];
      if (!item) return;
      speakText(item.speak, (utter) => {
        cardEl.classList.add("heard");
        statusEl.textContent = "🔊 播放中";
        hintEl.textContent = "聽完揀下方 ✓（啱）或 ✕（唔啱）";
        utter.onend = () => {
          statusEl.textContent = "已播放";
        };
        utter.onerror = () => {
          statusEl.textContent = "點一下再播";
        };
      });
    }

    function renderCard() {
      const item = deck[currentIndex];
      if (!item) return;
      lessonEl.textContent = item.lesson;
      wordEl.textContent = item.text;
      pinyinEl.textContent = item.pinyin;
      statusEl.textContent = "點一下發音";
      hintEl.textContent = "點一下聽普通話發音・下方揀 ✓ 或 ✕";
      cardEl.classList.remove("heard");
      updateHeader();
    }

    function showResults() {
      quizViewEl.classList.add("hidden");
      resultsViewEl.classList.remove("hidden");
      wrapEl.classList.add("results-mode");
      counterEl.textContent = `完成 ${deck.length} / ${deck.length}`;

      const rightCount = results.filter(r => r.correct).length;
      const wrongItems = results.filter(r => !r.correct);
      const wrongCount = wrongItems.length;

      const score = results.length ? Math.round((rightCount / results.length) * 100) : 0;
      const cheer = rumiLines(score);
      lastCheer = cheer;
      rumiBubbleEl.textContent = cheer.bubble;
      scoreValueEl.textContent = String(score);
      scoreValueEl.classList.toggle("is-triple", score >= 100);
      const scoreHeroEl = scoreValueEl.parentElement;
      scoreHeroEl.classList.remove("pop");
      void scoreHeroEl.offsetWidth;
      scoreHeroEl.classList.add("pop");
      tallyEl.innerHTML = `<span class="ok">✓ ${rightCount}</span> · <span class="bad">✕ ${wrongCount}</span>`;
      summaryRightPillEl.textContent = `✓ 啱 ${rightCount} 個`;
      summaryWrongPillEl.textContent = `✕ 唔啱 ${wrongCount} 個`;
      document.documentElement.classList.add("results-page");
      setTimeout(() => speakRumiCheer(cheer), 280);

      resultsListEl.innerHTML = "";
      results.forEach((entry, idx) => {
        const row = document.createElement("div");
        row.className = `result-row ${entry.correct ? "is-right" : "is-wrong"}`;
        row.setAttribute("role", "button");
        row.setAttribute("tabindex", "0");
        row.setAttribute("aria-label", `${entry.item.text}，${entry.correct ? "答啱" : "答錯"}，點擊聽發音`);

        row.innerHTML = `
          <div class="row-left">
            <span class="row-num">${idx + 1}</span>
            <div class="row-text">
              <div class="row-word-line">
                <span class="row-word">${entry.item.text}</span>
                <span class="row-pinyin">${entry.item.pinyin}</span>
              </div>
              <span class="row-lesson">${entry.item.lesson}</span>
            </div>
          </div>
          <span class="row-badge ${entry.correct ? "ok" : "bad"}">${entry.correct ? "✓ 啱" : "✕ 唔啱"}</span>
        `;

        const playRow = () => speakText(entry.item.speak);
        row.addEventListener("click", playRow);
        row.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            playRow();
          }
        });
        resultsListEl.appendChild(row);
      });

      if (wrongCount > 0) {
        retryWrongBtn.classList.remove("hidden");
        retryWrongBtn.textContent = `只重測答錯嘅詞（${wrongCount} 個）`;
      } else {
        retryWrongBtn.classList.add("hidden");
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function finishAdvance() {
      if (advanceTimer) {
        clearTimeout(advanceTimer);
        advanceTimer = null;
      }
      if (!isAdvancing) return;
      isAdvancing = false;
      rightBtn.disabled = false;
      wrongBtn.disabled = false;
      currentIndex += 1;
      updateHeader();

      if (currentIndex >= deck.length) {
        showResults();
      } else {
        renderCard();
      }
    }

    function recordAnswer(isCorrect) {
      if (isAdvancing) return;
      const item = deck[currentIndex];
      if (!item) return;

      isAdvancing = true;
      rightBtn.disabled = true;
      wrongBtn.disabled = true;
      results.push({ item, correct: isCorrect });
      updateHeader();

      const label = isCorrect ? "✓ 啱" : "✕ 唔啱";
      cardEl.classList.add("heard");
      statusEl.textContent = `${label}・🔊 朗讀中`;
      hintEl.textContent = "讀完自動跳去下一個詞…";

      if (!("speechSynthesis" in window)) {
        advanceTimer = setTimeout(finishAdvance, 450);
        return;
      }

      const fallbackMs = speechRate < 0.8 ? 3200 : 2200;
      advanceTimer = setTimeout(finishAdvance, fallbackMs);

      speakText(item.speak, (utter) => {
        utter.onend = () => {
          if (advanceTimer) {
            clearTimeout(advanceTimer);
            advanceTimer = null;
          }
          advanceTimer = setTimeout(finishAdvance, 250);
        };
        utter.onerror = () => {
          if (advanceTimer) {
            clearTimeout(advanceTimer);
            advanceTimer = null;
          }
          advanceTimer = setTimeout(finishAdvance, 250);
        };
      });
    }

    function startRound(sourceWords) {
      if (advanceTimer) {
        clearTimeout(advanceTimer);
        advanceTimer = null;
      }
      isAdvancing = false;
      rightBtn.disabled = false;
      wrongBtn.disabled = false;
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      deck = shuffle(sourceWords);
      currentIndex = 0;
      results = [];
      resultsViewEl.classList.add("hidden");
      quizViewEl.classList.remove("hidden");
      wrapEl.classList.remove("results-mode");
      document.documentElement.classList.remove("results-page");
      lastCheer = null;
      setRumiSpeaking(false);
      renderCard();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    speedNormalBtn.addEventListener("click", () => setSpeed("normal"));
    speedSlowBtn.addEventListener("click", () => setSpeed("slow"));

    cardEl.addEventListener("click", () => speakCurrent());
    cardEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        speakCurrent();
      }
    });

    replayBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      speakCurrent();
    });

    rightBtn.addEventListener("click", () => recordAnswer(true));
    wrongBtn.addEventListener("click", () => recordAnswer(false));

    rumiVoiceBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      speakRumiCheer(lastCheer);
    });

    restartAllBtn.addEventListener("click", () => startRound(WORDS));
    retryWrongBtn.addEventListener("click", () => {
      const wrongWords = results.filter(r => !r.correct).map(r => r.item);
      if (wrongWords.length > 0) {
        startRound(wrongWords);
      }
    });


    startRound(WORDS);
  </script>
</body>
</html>
